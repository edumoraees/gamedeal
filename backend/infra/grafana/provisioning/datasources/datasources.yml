apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Transforma o traceId que aparece em cada linha de log em um link para o trace no Zipkin
      derivedFields:
        - name: traceId
          matcherRegex: '\[[\w-]+,([a-f0-9]{16,32}),'
          url: '$${__value.raw}'
          datasourceUid: zipkin

  - name: Zipkin
    uid: zipkin
    type: zipkin
    access: proxy
    url: http://zipkin:9411
