# Somente o necessário para localizar o Consul.
# Todo o restante (porta, banco, segredo JWT, observabilidade) vem do Consul KV
# carregado por infra/consul/load-config.sh (Externalized + Centralized Configuration).
spring.application.name=auth-service
spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}
spring.config.import=consul:
